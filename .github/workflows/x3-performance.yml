name: X3 performance host checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x3-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    if: github.repository == 'Klohto/CrossInk'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ zlib1g-dev
      - name: Configure and build
        run: |
          cmake -S test -B build/performance-host -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/performance-host --parallel 2
      - name: Check accepted paths
        run: ctest --test-dir build/performance-host --output-on-failure -E 'Png|PNG'
